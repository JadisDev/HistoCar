version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: postgres_histo_car_
    restart: always
    environment:
      POSTGRES_USER: histo_car_user
      POSTGRES_PASSWORD: histo_car_password
      POSTGRES_DB: histo_car_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: histo_car__app
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: histo_car_user
      DATABASE_PASSWORD: histo_car_password
      DATABASE_NAME: histo_car_db
    ports:
      - '3000:3000'
    command: sh ./src/scripts/start.sh
    volumes:
      - ./src:/app/src
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
